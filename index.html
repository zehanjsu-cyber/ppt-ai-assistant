<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>宏观经济学 AI 助教</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <style>
    html, body { height: 100%; }
    main { height: 100%; display: flex; flex-direction: column; overflow: auto; }
    header, .primary, .status, .followup { flex-shrink: 0; }
    .answer-card { flex: 1; min-height: 100px; display: flex; flex-direction: column; }
    .answer { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    .panel { flex-shrink: 0; }
    .panel .check-label { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .panel input[type="checkbox"] { width: auto; }
    #scrollSeconds { width: 90px; }
    .show-view main { overflow: hidden; }
    .show-view #settings, .show-view header p { display: none; }
    .show-view .answer-card { min-height: 0; }
    .followup input { min-width: 0; }
    .show-view .followup { display: grid; margin-top: 8px; }
  </style>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <main>
    <header>
      <img class="tutor-avatar" src="tutor-avatar.png" alt="卡通 AI 助教">
      <div>
        <h1>宏观 AI 助教</h1>
        <p>读懂题目 · 讲清原理</p>
      </div>
    </header>

    <section id="settings" class="panel hidden">
      <label for="appKey">腾讯元器 AppKey</label>
      <input id="appKey" type="password" autocomplete="off" placeholder="只保存在本机">
      <div class="row">
        <button id="saveKey" class="secondary">保存</button>
        <button id="clearKey" class="quiet">清除</button>
      </div>
      <p class="hint">AppKey 仅保存在本机加载项存储中，不会写入 PPT 或公开网页。</p>
      <hr>
      <button id="toggleAuto" class="secondary">将本页设为自动讲解页</button>
      <p id="autoStatus" class="hint">备课时在需要自动讲解的页面开启。</p>
      <hr>
      <label class="check-label"><input id="rainStatsEnabled" type="checkbox">根据雨课堂作答情况讲解（默认关闭）</label>
      <p id="rainStatsStatus" class="hint">开启后，读取刚刚关闭的作答情况小窗口；未识别到时仍按原方式讲题。</p>
      <button id="checkRainStats" class="secondary" type="button">课前一键自检</button>
      <hr>
      <label class="check-label"><input id="autoScroll" type="checkbox" checked>放映时自动滚动讲解</label>
      <label for="scrollSeconds">每屏停留时间（秒）</label>
      <input id="scrollSeconds" type="number" min="5" max="120" step="1" value="15">
      <button id="saveScroll" class="secondary">保存滚动设置</button>
      <p id="scrollStatus" class="hint">关闭语音时按此时间换屏；朗读时跟随阅读进度，末尾停止。</p>
      <hr>
      <label class="check-label"><input id="voiceEnabled" type="checkbox">放映时语音讲解（默认关闭）</label>
      <label for="voiceRate">语速</label>
      <select id="voiceRate"><option value="0.85">稍慢</option><option value="1" selected>正常</option><option value="1.15">稍快</option></select>
      <label for="voiceSelect">中文声音（选择后可直接试听）</label>
      <select id="voiceSelect"><option value="">正在获取本机声音…</option></select>
      <label for="voiceRepeat">朗读次数</label>
      <select id="voiceRepeat"><option value="1">每次进入读一遍</option><option value="2">读两遍，间隔 5 秒</option><option value="0">循环朗读，翻页或停止后结束</option></select>
      <div class="row"><button id="saveVoice" class="secondary">保存语音设置</button><button id="testVoice" class="secondary">课前试听</button><button id="stopVoice" class="quiet">停止朗读</button></div>
      <p id="voiceStatus" class="hint">使用本机中文语音。请课前试听确认音响；进入放映后自动发声仍可能受 PowerPoint 限制。</p>
    </section>

    <button id="explainButton" class="primary" disabled>宏观 AI 助教讲解本题</button>
    <p id="status" class="status">正在连接 PowerPoint…</p>
    <p id="rainStatsLiveStatus" class="hint stats-badge" aria-live="polite">学情数据：功能未启用</p>
    <div class="settings-toolbar" style="flex-shrink:0;margin:0 0 8px"><button id="settingsButton" class="secondary" aria-label="设置" style="padding:6px 12px">⚙︎ 助教设置</button></div>

    <section class="answer-card">
      <div class="answer-title">本题解析 <span id="readingStatus" aria-live="polite">等待讲解</span><button id="replayVoice" class="secondary" disabled style="padding:4px 10px;font-size:12px">播放 / 重听</button></div>
      <p id="voiceLiveStatus" class="hint" aria-live="polite" style="flex-shrink:0;margin:0 0 6px;font-size:11px">语音状态将在这里显示；自动发声受限时，请点“播放 / 重听”。</p>
      <div id="followupQuestion" class="hidden" style="flex-shrink:0;padding:8px 10px;margin-bottom:8px;background:#edf3fa;border-radius:8px;overflow-wrap:anywhere;max-height:80px;overflow:auto" aria-live="polite"></div>
      <div id="answer" class="answer">点击上方按钮后，答案会显示在这里。</div>
    </section>

    <div class="followup">
      <input id="followupInput" type="text" aria-label="继续追问" placeholder="输入追问，点击发送或按回车" autocomplete="off">
      <button id="followupButton" class="secondary" type="button" disabled>发送</button>
    </div>
  </main>
  <script src="app.js?v=13"></script>
  <script src="voice.js?v=4"></script>
  <script src="scroll.js?v=6"></script>
</body>
</html>
